        paused: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ConsultationCheckoutState:
      type: object
      required: [paused, reason, changedAt]
      properties:
        paused: { type: boolean }
        reason: { type: ["string", "null"] }
        changedAt: { type: ["string", "null"], format: date-time }
    GrievanceInput:
      type: object
      required: [category, description]
      properties:
        category: { type: string, enum: [account, consultation, payment, privacy, other] }
        description: { type: string, minLength: 10, maxLength: 1200 }
    GrievanceStatus:
      type: string
      enum: [submitted, under_review, resolved]
    MyGrievance:
      type: object
      required: [id, category, description, status, officerResponse, submittedAt, updatedAt, respondedAt]
      properties:
        id: { type: string }
        category: { type: string, enum: [account, consultation, payment, privacy, other] }
        description: { type: string }
        status: { $ref: "#/components/schemas/GrievanceStatus" }
        officerResponse: { type: string }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
    AdminGrievance:
      allOf:
        - { $ref: "#/components/schemas/MyGrievance" }
        - type: object
          required: [clientName, clientEmail]
          properties:
            clientName: { type: string }
            clientEmail: { type: string, format: email }
    AdminGrievanceUpdate:
      type: object
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/GrievanceStatus" }
        response: { type: string, minLength: 3, maxLength: 3000 }
    TwilioUsageBudgetInput:
      type: object
