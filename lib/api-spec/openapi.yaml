        periodEnd: { type: ["string", "null"], format: date }
        status: { type: string, enum: [success, partial, no_data] }
        spend: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        participantMinutes: { type: ["number", "null"] }
        usageAsOf: { type: ["string", "null"], format: date-time }
        checkedAt: { type: string, format: date-time }
    Account:
