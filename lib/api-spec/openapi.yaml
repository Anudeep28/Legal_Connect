        mimeType: { type: string, enum: [audio/webm, audio/mp4, audio/wav, audio/ogg] }
        language: { type: string }
    TextResult:
      type: object
      required: [text]
      properties:
        text: { type: string }
    Notification:
      type: object
      required: [id, title, body, read, link, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: string }
        createdAt: { type: string }
    AdminOverview:
      type: object
      required: [users, lawyers, pendingLawyers, consultations, completedConsultations, documents]
      properties:
        users: { type: integer }
        lawyers: { type: integer }
        pendingLawyers: { type: integer }
        consultations: { type: integer }
        completedConsultations: { type: integer }
        documents: { type: integer }
    AdminAiUsage:
      type: object
      required: [days, retentionDays, rows, monthlyBudget]
      properties:
        days: { type: integer }
        retentionDays: { type: integer }
        monthlyBudget: { $ref: "#/components/schemas/AdminAiUsageBudget" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminAiUsageRow" }
    AdminAiUsageBudget:
      type: object
      required: [enabled, monthlyBudgetUsd, warningPercent, monthStart, currentMonthEstimatedUsd, costCoverage, requests, pricedRequests, alertLevel]
      properties:
        enabled: { type: boolean }
        monthlyBudgetUsd: { type: ["number", "null"], minimum: 0 }
        warningPercent: { type: integer, minimum: 50, maximum: 95 }
        monthStart: { type: string, format: date }
        currentMonthEstimatedUsd: { type: ["number", "null"], minimum: 0 }
        costCoverage: { type: string, enum: [no_usage, unavailable, partial, complete] }
        requests: { type: integer, minimum: 0 }
        pricedRequests: { type: integer, minimum: 0 }
        alertLevel: { type: string, enum: [none, approaching, reached] }
    AiUsageBudgetInput:
      type: object
      required: [enabled, monthlyBudgetUsd, warningPercent]
      properties:
        enabled: { type: boolean }
        monthlyBudgetUsd: { type: ["number", "null"], minimum: 0.01, maximum: 1000000000 }
        warningPercent: { type: integer, minimum: 50, maximum: 95 }
    AdminAiUsageRow:
      type: object
      required: [day, lawyerId, lawyerName, provider, requests, successfulRequests, successfulRequestsKnown, tokenUsageRequests, inputTokens, outputTokens, pricedRequests, estimatedCostUsd]
      properties:
        day: { type: string, format: date }
        lawyerId: { type: string }
        lawyerName: { type: string }
        provider: { type: string, enum: [deepseek, elevenlabs] }
        requests: { type: integer }
        successfulRequests: { type: integer }
        successfulRequestsKnown: { type: boolean }
        tokenUsageRequests: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        pricedRequests: { type: integer }
        estimatedCostUsd: { type: ["number", "null"], minimum: 0 }
    UserModeration:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, suspended, deactivated] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    LawyerModeration:
      type: object
      required: [approvalStatus, reason]
      properties:
        approvalStatus: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ReviewModeration:
      type: object
      required: [visible, reason]
      properties:
        visible: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    CheckoutInput:
      type: object
      required: [plan]
      properties:
        plan: { type: string, enum: [single, monthly, consultation] }
        consultationId: { type: string, minLength: 1, maxLength: 100 }
    CheckoutOrder:
      type: object
      required: [id, keyId, providerOrderId, amount, currency, mode]
      properties:
        id: { type: string }
        keyId: { type: string }
        providerOrderId: { type: string }
        amount: { type: integer }
        currency: { type: string }
        mode: { type: string, enum: [test, live] }
    ChargeApproval:
      type: object
      required: [approveCharge]
      properties:
        approveCharge: { type: boolean }
    PaymentVerification:
      type: object
      required: [id, paymentId, signature]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        paymentId: { type: string, minLength: 1, maxLength: 100 }
        signature: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    PaymentRecord:
      type: object
      required: [id, kind, amount, currency, mode, status, providerOrderId, usedCount, createdAt, refundable]
      properties:
        id: { type: string }
        kind: { type: string, enum: [single, monthly, consultation] }
        consultationId: { type: string, nullable: true }
        amount: { type: integer }
        currency: { type: string }
        mode: { type: string, enum: [test, live] }
        status: { type: string, enum: [pending, paid, refund_pending, refunded] }
        providerOrderId: { type: string }
        providerPaymentId: { type: string, nullable: true }
        usedCount: { type: integer }
        paidAt: { type: string, nullable: true }
        entitlementEndsAt: { type: string, nullable: true }
        createdAt: { type: string }
        refundable: { type: boolean }
