openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Consult with Lawyer — independent legal consultation platform.
servers:
  - url: /api
paths:
  /communications/dispatch:
    post:
      operationId: dispatchCommunications
      description: Machine-only scheduler endpoint. Requires COMMUNICATION_WORKER_SECRET, never a browser session. Acknowledges a worker tick, not delivery.
      security:
        - SchedulerKey: []
      responses:
        "202":
          description: Dispatch tick acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "401":
          description: Scheduler authorization missing or invalid
        "503":
          description: Scheduler secret not configured
  /me/phone/challenge:
    post:
      operationId: requestPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneInput" }
      responses:
        "200":
          description: Provider accepted the SMS verification request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationChallenge" }
  /me/phone/verify:
    post:
      operationId: confirmPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneCodeInput" }
      responses:
        "200":
          description: Provider verified the phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /me/push-subscriptions:
    post:
      operationId: savePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "200":
          description: Saved subscription and enabled push preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
    delete:
      operationId: removePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushEndpointInput" }
      responses:
        "200":
          description: Removed this browser subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /me/deliveries:
    get:
      operationId: listCommunicationDeliveries
      responses:
        "200":
          description: Recent outbound delivery attempts, not inbox receipts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommunicationDelivery" } }
  /consultations/{id}/call:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getConsultationCall
      responses:
        "200":
          description: Participant-only call eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallAvailability" }
    post:
      operationId: joinConsultationCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallConsentInput" }
      responses:
        "200":
          description: Short-lived participant-scoped Twilio audio-room token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallAccess" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /platform:
    get:
      operationId: getPlatform
      responses:
        "200":
          description: Public resources and service availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Platform" }
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /lawyers:
    get:
      operationId: listLawyers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: practiceArea, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, fee_asc, fee_desc, experience, rating] } }
      responses:
        "200":
          description: Lawyers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lawyer" } }
  /lawyers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getLawyer
      responses:
        "200":
          description: Lawyer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /lawyers/{id}/slots/{date}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getLawyerSlots
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Available half-hour slots in IST
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /lawyers/{id}/reviews:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listLawyerReviews
      responses:
        "200":
          description: Visible consultation reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
  /lawyer/profile:
    get:
      operationId: getLawyerProfile
      responses:
        "200":
          description: Own profile or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Lawyer" }
                  - { type: "null" }
    put:
      operationId: saveLawyerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerInput" }
      responses:
        "200":
          description: Submitted profile, pending approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /consultations:
    get:
      operationId: listConsultations
      responses:
        "200":
          description: Account consultations, restricted by role
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Consultation" } }
    post:
      operationId: createConsultation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationInput" }
      responses:
        "201":
          description: Request saved, no payment collected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
  /consultations/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getConsultation
      responses:
        "200":
          description: Consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
    patch:
      operationId: updateConsultation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
  /consultations/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listMessages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /consultations/{id}/deliverables:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listDeliverables
      responses:
        "200":
          description: Lawyer drafts or client delivered documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deliverable" } }
    post:
      operationId: createDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverable" }
  /deliverables/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: updateDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableInput" }
      responses:
        "200":
          description: Updated or delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverable" }
  /consultations/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          description: Lawyer documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getDocument
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    patch:
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      operationId: deleteDocument
      responses:
        "204": { description: Deleted }
  /documents/{id}/duplicate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: duplicateDocument
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /writing/assist:
    post:
      operationId: assistWriting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WritingInput" }
      responses:
        "200":
          description: AI assistance, subject to lawyer review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextResult" }
  /writing/transcribe:
    post:
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioInput" }
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextResult" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
  /notifications/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: readNotification
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Administration summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
  /admin/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserModeration" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /admin/lawyers:
    get:
      operationId: listAdminLawyers
      responses:
        "200":
          description: Lawyer applications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lawyer" } }
  /admin/lawyers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateLawyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerModeration" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
  /admin/reviews/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewModeration" }
      responses:
        "200":
          description: Moderated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /billing/checkout:
    post:
      operationId: createCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Server-created Razorpay order, not yet paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
        "503":
          description: Payment provider not connected; no payment collected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceError" }
  /billing/verify:
    post:
      operationId: verifyPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentVerification" }
      responses:
        "200":
          description: Verified payment and current entitlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/validation-checkout:
    post:
      operationId: createValidationCheckout
      description: Administrator-only explicit 10 INR verification purchase before general checkout activation. Does not enable checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeApproval" }
      responses:
        "200":
          description: Administrator verification order, not yet paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
  /billing/payments:
    get:
      operationId: listPayments
      responses:
        "200":
          description: Current account payment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/payments/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reconcilePayment
      responses:
        "200":
          description: Current provider-confirmed payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/payments/{id}/refund:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refundPayment
      responses:
        "200":
          description: Eligible refund submitted or reconciled, not necessarily processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/webhook:
    post:
      operationId: receivePaymentWebhook
      description: Public Razorpay endpoint, authenticated by HMAC over the raw body.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
        - name: x-razorpay-event-id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event applied or already processed
components:
  securitySchemes:
    SchedulerKey:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ServiceError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Category:
      type: object
      required: [id, name, description, count]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        count: { type: integer }
    Template:
      type: object
      required: [id, name, category, description, content, fields]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        content: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/TemplateField" }
    TemplateField:
      type: object
      required: [id, name, type, required]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
    Plan:
      type: object
      required: [id, name, price, description, features]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        description: { type: string }
        features: { type: array, items: { type: string } }
    Platform:
      type: object
      required: [name, demo, paymentsEnabled, callsEnabled, emailEnabled, pushEnabled, phoneVerificationEnabled, recordingEnabled, remindersEnabled, aiEnabled, draftingEnabled, dictationEnabled, categories, templates, languages, plans, lawyerCount, onlineCount]
      properties:
        name: { type: string }
        demo: { type: boolean }
        paymentsEnabled: { type: boolean }
        callsEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        phoneVerificationEnabled: { type: boolean }
        recordingEnabled: { type: boolean, const: false }
        remindersEnabled: { type: boolean }
        pushPublicKey: { type: ["string", "null"] }
        aiEnabled: { type: boolean }
        draftingEnabled: { type: boolean }
        dictationEnabled: { type: boolean }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        templates: { type: array, items: { $ref: "#/components/schemas/Template" } }
        languages: { type: array, items: { type: string } }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        lawyerCount: { type: integer }
        onlineCount: { type: integer }
    Account:
      type: object
      required: [id, name, email, role, status, emailNotifications, pushNotifications, phone, phoneVerifiedAt, subscriptionPlan, documentCredits, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [client, lawyer, admin] }
        status: { type: string, enum: [active, suspended, deactivated] }
        emailNotifications: { type: boolean }
        pushNotifications: { type: boolean }
        phone: { type: ["string", "null"] }
        phoneVerifiedAt: { type: ["string", "null"] }
        subscriptionPlan: { type: string }
        subscriptionExpiresAt: { type: string, nullable: true }
        documentCredits: { type: integer }
        createdAt: { type: string }
    AccountInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        emailNotifications: { type: boolean }
        pushNotifications: { type: boolean }
    PhoneInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
    PhoneCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{4,10}$' }
    VerificationChallenge:
      type: object
      required: [maskedPhone, expiresAt]
      properties:
        maskedPhone: { type: string }
        expiresAt: { type: string }
    PushEndpointInput:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 80, maxLength: 100 }
            auth: { type: string, minLength: 20, maxLength: 30 }
    ActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    CallConsentInput:
      type: object
      required: [microphoneConsent, recordingDisabledAcknowledged]
      properties:
        microphoneConsent: { type: boolean, const: true }
        recordingDisabledAcknowledged: { type: boolean, const: true }
    CallAvailability:
      type: object
      required: [enabled, canJoin, reason, recordingEnabled, opensAt, closesAt]
      properties:
        enabled: { type: boolean }
        canJoin: { type: boolean }
        reason: { type: string }
        recordingEnabled: { type: boolean, const: false }
        opensAt: { type: string }
        closesAt: { type: string }
    CallAccess:
      type: object
      required: [token, room, expiresAt, closesAt, recordingEnabled]
      properties:
        token: { type: string }
        room: { type: string }
        expiresAt: { type: string }
        closesAt: { type: string }
        recordingEnabled: { type: boolean, const: false }
    CommunicationDelivery:
      type: object
      required: [id, channel, status, attempts, nextAttemptAt, lastError, createdAt]
      properties:
        id: { type: string }
        channel: { type: string, enum: [email, push] }
        status: { type: string, enum: [pending, processing, retry, blocked, accepted, skipped, failed] }
        attempts: { type: integer }
        nextAttemptAt: { type: string }
        lastError: { type: ["string", "null"] }
        createdAt: { type: string }
    Lawyer:
      type: object
      required: [id, name, title, bio, practiceAreas, languages, experienceYears, barCouncil, enrollmentNumber, fee, documentFeePercent, rating, reviewCount, verified, approvalStatus, online, city, avatarUrl, demo, availability, rejectionReason]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        bio: { type: string }
        practiceAreas: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        experienceYears: { type: integer }
        barCouncil: { type: string }
        enrollmentNumber: { type: string }
        fee: { type: integer, description: INR for 30-minute consultation }
        documentFeePercent: { type: integer }
        rating: { type: number }
        reviewCount: { type: integer }
        verified: { type: boolean }
        approvalStatus: { type: string, enum: [pending, approved, rejected] }
        online: { type: boolean }
        city: { type: string }
        avatarUrl: { type: string }
        demo: { type: boolean }
        availability: { type: array, items: { type: integer } }
        rejectionReason: { type: string }
    LawyerInput:
      type: object
      required: [name, title, bio, practiceAreas, languages, experienceYears, barCouncil, enrollmentNumber, fee, city, availability, online]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        title: { type: string, minLength: 3, maxLength: 150 }
