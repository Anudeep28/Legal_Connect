openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Consult with Lawyer — independent legal consultation platform.
servers:
  - url: /api
paths:
  /communications/dispatch:
    post:
      operationId: dispatchCommunications
      description: Machine-only scheduler endpoint. Requires COMMUNICATION_WORKER_SECRET, never a browser session. Acknowledges a worker tick, not delivery.
      security:
        - SchedulerKey: []
      responses:
        "202":
          description: Dispatch tick acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "401":
          description: Scheduler authorization missing or invalid
        "503":
          description: Scheduler secret not configured
  /me/phone/challenge:
    post:
      operationId: requestPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneInput" }
      responses:
        "200":
          description: Provider accepted the SMS verification request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationChallenge" }
  /me/phone/verify:
    post:
      operationId: confirmPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneCodeInput" }
      responses:
        "200":
          description: Provider verified the phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /me/push-subscriptions:
    post:
      operationId: savePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "200":
          description: Saved subscription and enabled push preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
    delete:
      operationId: removePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushEndpointInput" }
      responses:
        "200":
          description: Removed this browser subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /me/deliveries:
    get:
      operationId: listCommunicationDeliveries
      responses:
        "200":
          description: Recent outbound delivery attempts, not inbox receipts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommunicationDelivery" } }
  /consultations/{id}/call:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getConsultationCall
      responses:
        "200":
          description: Participant-only call eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallAvailability" }
    post:
      operationId: joinConsultationCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallConsentInput" }
      responses:
        "200":
          description: Short-lived participant-scoped Twilio audio-room token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallAccess" }
  /consultations/{id}/call/recording-consent:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: setCallRecordingConsent
      description: Saves or withdraws this participant's per-consultation recording choice. Recording is optional; a no-consent choice locks the consultation to an unrecorded call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallRecordingConsentInput" }
      responses:
        "200":
          description: Current mutual-consent state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallRecordingConsentState" }
  /consultations/{id}/call/recording-language:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: updateCallRecordingLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallRecordingLanguageInput" }
      responses:
        "200":
          description: Saved language preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallRecordingLanguageResponse" }
  /consultations/{id}/call-transcripts:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listCallTranscripts
      responses:
        "200":
          description: Private transcripts for the assigned lawyer
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CallTranscriptSession" } }
  /consultations/{id}/call-transcripts/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCallTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallTranscriptUpdate" }
      responses:
        "200":
          description: Updated private transcript
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallTranscriptSession" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      operationId: readinessCheck
      responses:
        "200":
          description: API is ready for database-backed requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessCheckStatus" }
        "503":
          description: Database-backed requests are unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessCheckStatus" }
  /platform:
    get:
      operationId: getPlatform
      responses:
        "200":
          description: Public resources and service availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Platform" }
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /lawyers:
    get:
      operationId: listLawyers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: practiceArea, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, fee_asc, fee_desc, experience, rating] } }
      responses:
        "200":
          description: Lawyers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lawyer" } }
  /lawyers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getLawyer
      responses:
        "200":
          description: Lawyer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /lawyers/{id}/slots/{date}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getLawyerSlots
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Available half-hour slots in IST
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /lawyers/{id}/reviews:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listLawyerReviews
      responses:
        "200":
          description: Visible consultation reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
  /lawyer/profile:
    get:
      operationId: getLawyerProfile
      responses:
        "200":
          description: Own profile or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Lawyer" }
                  - { type: "null" }
    put:
      operationId: saveLawyerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerInput" }
      responses:
        "200":
          description: Submitted profile, pending approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /consultations:
    get:
      operationId: listConsultations
      responses:
        "200":
          description: Account consultations, restricted by role
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Consultation" } }
    post:
      operationId: createConsultation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationInput" }
      responses:
        "201":
          description: Request saved, no payment collected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
  /consultations/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getConsultation
      responses:
        "200":
          description: Consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
    patch:
      operationId: updateConsultation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consultation" }
  /consultations/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listMessages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /consultations/{id}/deliverables:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: listDeliverables
      responses:
        "200":
          description: Lawyer drafts or client delivered documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deliverable" } }
    post:
      operationId: createDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverable" }
  /deliverables/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: updateDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverableInput" }
      responses:
        "200":
          description: Updated or delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverable" }
  /consultations/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          description: Lawyer documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getDocument
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    patch:
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      operationId: deleteDocument
      responses:
        "204": { description: Deleted }
  /documents/{id}/duplicate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: duplicateDocument
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /writing/usage:
    get:
      operationId: getWritingUsage
      responses:
        "200":
          description: Daily allowances for the authenticated lawyer. Provider attempts including failures count; resets at midnight UTC.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WritingAllowance" }
  /writing/assist:
    post:
      operationId: assistWriting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WritingInput" }
      responses:
        "200":
          description: AI assistance, subject to lawyer review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextResult" }
  /writing/transcribe:
    post:
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioInput" }
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextResult" }
  /writing/consultations/{id}/call-transcripts/{sessionId}/draft:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    post:
      operationId: draftFromCallTranscript
      description: Creates a private AI draft preview from a lawyer-edited transcript and selected legal template. Does not create or deliver a document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallTranscriptDraftInput" }
      responses:
        "200":
          description: Draft preview for lawyer review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallTranscriptDraftResponse" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
  /notifications/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: readNotification
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /grievances:
    get:
      operationId: listMyGrievances
      description: Lists only the signed-in client's grievance records.
      responses:
        "200":
          description: This client's grievance submissions and current responses
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MyGrievance" } }
    post:
      operationId: submitGrievance
      description: Creates a minimal grievance record. Do not include case facts or unnecessary matter details.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrievanceInput" }
      responses:
        "201":
          description: Grievance submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyGrievance" }
  /admin/grievances:
    get:
      operationId: listAdminGrievances
      description: Lists grievances for the grievance officer or owner-designated administrator only.
      responses:
        "200":
          description: Grievances awaiting or receiving officer review
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminGrievance" } }
        "403":
          description: Grievance-officer access required
  /admin/grievances/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: updateAdminGrievance
      description: Updates a grievance status and/or records the officer's response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGrievanceUpdate" }
      responses:
        "200":
          description: Updated grievance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGrievance" }
        "403":
          description: Grievance-officer access required
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Administration summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/ai-usage:
    get:
      operationId: getAdminAiUsage
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Daily AI request aggregates and available usage-based estimates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiUsage" }
        "403":
          description: Only the owner-designated administrator may view AI usage
  /admin/ai-usage-budget:
    put:
      operationId: updateAdminAiUsageBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiUsageBudgetInput" }
      responses:
        "200":
          description: Updated monthly AI spend alert settings and current estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiUsageBudget" }
        "400":
          description: Invalid monthly budget or warning threshold
        "403":
          description: Only the owner-designated administrator may configure alerts
  /admin/legal-review:
    get:
      operationId: getAdminLegalReview
      responses:
        "200":
          description: Current counsel approval and consultation checkout gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLegalReview" }
    put:
      operationId: recordAdminLegalReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalCounselApprovalInput" }
      responses:
        "200":
          description: Counsel approval and policy contacts recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLegalReview" }
        "403":
          description: Only the owner-designated administrator may record approval
  /admin/consultation-checkout:
    put:
      operationId: updateAdminConsultationCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultationCheckoutPauseInput" }
      responses:
        "200":
          description: Paid consultation checkout pause state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsultationCheckoutState" }
        "403":
          description: Only the owner-designated administrator may pause or resume checkout
  /admin/twilio-usage-budget:
    get:
      operationId: getAdminTwilioUsageBudget
      responses:
        "200":
          description: Owner-configured monthly Twilio Video alert budget and latest provider usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTwilioUsageBudget" }
        "403":
          description: Only the owner-designated administrator may view call usage
    put:
      operationId: updateAdminTwilioUsageBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwilioUsageBudgetInput" }
      responses:
        "200":
          description: Updated monthly usage alert settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTwilioUsageBudget" }
        "400":
          description: Invalid budget or warning threshold
        "403":
          description: Only the owner-designated administrator may configure alerts
  /admin/twilio-usage-budget/refresh:
    post:
      operationId: refreshAdminTwilioUsageBudget
      responses:
        "200":
          description: Latest posted provider usage, or a safe status when lookup fails
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTwilioUsageBudget" }
        "403":
          description: Only the owner-designated administrator may request a lookup
  /admin/twilio-usage-history:
    get:
      operationId: getAdminTwilioUsageHistory
      responses:
        "200":
          description: Stored monthly snapshots of account-level Twilio Programmable Video usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTwilioUsageHistory" }
        "403":
          description: Only the owner-designated administrator may view call usage
  /admin/users:
    get:
      operationId: listAdminUsers
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
  /admin/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserModeration" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /admin/lawyers:
    get:
      operationId: listAdminLawyers
      responses:
        "200":
          description: Lawyer applications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lawyer" } }
  /admin/lawyers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateLawyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LawyerModeration" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lawyer" }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
  /admin/reviews/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      operationId: moderateReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewModeration" }
      responses:
        "200":
          description: Moderated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /billing/checkout:
    post:
      operationId: createCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Server-created Razorpay order, not yet paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
        "503":
          description: Payment provider not connected; no payment collected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceError" }
  /billing/verify:
    post:
      operationId: verifyPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentVerification" }
      responses:
        "200":
          description: Verified payment and current entitlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/validation-checkout:
    post:
      operationId: createValidationCheckout
      description: Administrator-only explicit 10 INR verification purchase before general checkout activation. Does not enable checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeApproval" }
      responses:
        "200":
          description: Administrator verification order, not yet paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
  /billing/payments:
    get:
      operationId: listPayments
      responses:
        "200":
          description: Current account payment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/payments/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reconcilePayment
      responses:
        "200":
          description: Current provider-confirmed payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/payments/{id}/refund:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refundPayment
      responses:
        "200":
          description: Eligible refund submitted or reconciled, not necessarily processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
  /billing/webhook:
    post:
      operationId: receivePaymentWebhook
      description: Public Razorpay endpoint, authenticated by HMAC over the raw body.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
        - name: x-razorpay-event-id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event applied or already processed
components:
  securitySchemes:
    SchedulerKey:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ReadinessCheckStatus:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        database: { type: string, enum: [ok, unavailable] }
    ServiceError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Category:
      type: object
      required: [id, name, description, count]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        count: { type: integer }
    Template:
      type: object
      required: [id, name, category, description, content, fields]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        content: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/TemplateField" }
    TemplateField:
      type: object
      required: [id, name, type, required]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
    Plan:
      type: object
      required: [id, name, price, description, features]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        description: { type: string }
        features: { type: array, items: { type: string } }
    Platform:
      type: object
      required: [name, demo, paymentsEnabled, legalReviewComplete, paidConsultationsEnabled, consultationCheckoutPaused, policyContacts, callsEnabled, emailEnabled, pushEnabled, phoneVerificationEnabled, recordingEnabled, remindersEnabled, aiEnabled, draftingEnabled, dictationEnabled, categories, templates, languages, plans, lawyerCount, onlineCount]
      properties:
        name: { type: string }
        demo: { type: boolean }
        paymentsEnabled: { type: boolean }
        legalReviewComplete: { type: boolean }
        paidConsultationsEnabled: { type: boolean }
        consultationCheckoutPaused: { type: boolean }
        policyContacts:
          oneOf:
            - { $ref: "#/components/schemas/ApprovedPolicyContacts" }
            - { type: "null" }
        callsEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        phoneVerificationEnabled: { type: boolean }
        recordingEnabled: { type: boolean }
        remindersEnabled: { type: boolean }
        pushPublicKey: { type: ["string", "null"] }
        aiEnabled: { type: boolean }
        draftingEnabled: { type: boolean }
        dictationEnabled: { type: boolean }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        templates: { type: array, items: { $ref: "#/components/schemas/Template" } }
        languages: { type: array, items: { type: string } }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        lawyerCount: { type: integer }
        onlineCount: { type: integer }
    ApprovedPolicyContacts:
      type: object
      required: [supportContactEmail, privacyContactEmail, privacyContactAddress, grievanceOfficerName, grievanceOfficerEmail]
      properties:
        supportContactEmail: { type: string, format: email }
        privacyContactEmail: { type: string, format: email }
        privacyContactAddress: { type: string }
        grievanceOfficerName: { type: string }
        grievanceOfficerEmail: { type: string, format: email }
    LegalCounselApproval:
      type: object
      required: [counselName, barCouncil, enrollmentNumber, counselEmail, supportContactEmail, privacyContactEmail, privacyContactAddress, grievanceOfficerName, grievanceOfficerEmail, approvedAt]
      properties:
        counselName: { type: string }
        barCouncil: { type: string }
        enrollmentNumber: { type: string }
        counselEmail: { type: string, format: email }
        supportContactEmail: { type: string, format: email }
        privacyContactEmail: { type: string, format: email }
        privacyContactAddress: { type: string }
        grievanceOfficerName: { type: string }
        grievanceOfficerEmail: { type: string, format: email }
        approvedAt: { type: string }
    LegalCounselApprovalInput:
      type: object
      required: [counselName, barCouncil, enrollmentNumber, counselEmail, supportContactEmail, privacyContactEmail, privacyContactAddress, grievanceOfficerName, grievanceOfficerEmail, confirmApproval]
      properties:
        counselName: { type: string, minLength: 2, maxLength: 160 }
        barCouncil: { type: string, minLength: 2, maxLength: 160 }
        enrollmentNumber: { type: string, minLength: 2, maxLength: 80 }
        counselEmail: { type: string, format: email, maxLength: 254 }
        supportContactEmail: { type: string, format: email, maxLength: 254 }
        privacyContactEmail: { type: string, format: email, maxLength: 254 }
        privacyContactAddress: { type: string, minLength: 8, maxLength: 500 }
        grievanceOfficerName: { type: string, minLength: 2, maxLength: 160 }
        grievanceOfficerEmail: { type: string, format: email, maxLength: 254 }
        confirmApproval: { type: boolean, const: true }
    AdminLegalReview:
      type: object
      required: [canRecord, canManageGrievances, paymentVerificationComplete, paidConsultationsEnabled, consultationCheckout]
      properties:
        canRecord: { type: boolean }
        canManageGrievances: { type: boolean }
        paymentVerificationComplete: { type: boolean }
        paidConsultationsEnabled: { type: boolean }
        consultationCheckout: { $ref: "#/components/schemas/ConsultationCheckoutState" }
        approval:
          oneOf:
            - { $ref: "#/components/schemas/LegalCounselApproval" }
            - { type: "null" }
    ConsultationCheckoutPauseInput:
      type: object
