        warningPercent: { type: integer, minimum: 50, maximum: 95 }
    AdminTwilioUsageBudget:
      type: object
      required: [enabled, budgetAmount, budgetCurrency, warningPercent, lookupStatus, currentSpend, usageCurrency, participantMinutes, periodStart, periodEnd, usageAsOf, lastAttemptAt, lastSuccessAt, providerConfigured, dataDelayed, currencyMatches, periodCurrent, alertLevel]
      properties:
        enabled: { type: boolean }
        budgetAmount: { type: ["number", "null"] }
        budgetCurrency: { type: string }
        warningPercent: { type: integer }
        lookupStatus:
          type: string
          enum: [not_checked, checking, success, partial, no_data, failed, not_configured]
        currentSpend: { type: ["number", "null"] }
        usageCurrency: { type: ["string", "null"] }
        participantMinutes: { type: ["number", "null"] }
        periodStart: { type: ["string", "null"] }
        periodEnd: { type: ["string", "null"] }
        usageAsOf: { type: ["string", "null"], format: date-time }
        lastAttemptAt: { type: ["string", "null"], format: date-time }
        lastSuccessAt: { type: ["string", "null"], format: date-time }
        providerConfigured: { type: boolean }
        dataDelayed: { type: boolean }
        currencyMatches: { type: boolean }
        periodCurrent: { type: boolean }
        alertLevel: { type: string, enum: [none, approaching, reached] }
