services:
  minio:
    image: quay.io/minio/minio:${MINIO_IMAGE_TAG:?Set MINIO_IMAGE_TAG to a verified release tag}
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped
    env_file:
      - /etc/consultwithlawyer/minio.env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - /srv/minio/consultwithlawyer:/data
