services:
  app:
    build:
      context: ../..
      dockerfile: deploy/ubuntu/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set the production Clerk publishable key}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:?Set the production Clerk proxy URL}
    image: consultwithlawyer:local
    init: true
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/etc/consultwithlawyer/app.env}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "8080"
      OBJECT_STORAGE_PROVIDER: local
      LOCAL_OBJECT_STORAGE_DIR: /var/lib/legal-connect/objects
      SERVE_FRONTEND: "true"
      FRONTEND_DIST_DIR: /app/artifacts/consult-lawyer/dist/public
    network_mode: host
    volumes:
      - /srv/consultwithlawyer/uploads:/var/lib/legal-connect/objects
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
